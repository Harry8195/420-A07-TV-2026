
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #222;
        }

        #count {
            font-size: 18px;
            font-weight: bold;
            color: #2563eb;
        }

        main {
            max-width: 1000px;
            margin: auto;
        }

        /* One column on mobile phones */
        #todo-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .card {
            background-color: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            color: #333;
        }

        .status {
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
        }

        /* Two columns on screens 768px and wider */
        @media (min-width: 768px) {
            #todo-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        #message {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Todo Dashboard</h1>
        <p id="count">Loading tasks...</p>
    </header>

    <main>

        <h2>My Tasks</h2>

        <div id="message">Loading…</div>

        <section id="todo-list" aria-label="Todo tasks">
        </section>

    </main>

    <footer>
        <p>Todo Dashboard - 2026</p>
    </footer>

    <script>

        // Get HTML elements
        const todoList = document.getElementById("todo-list");
        const count = document.getElementById("count");
        const message = document.getElementById("message");

        // Fetch and display todos
        async function loadTodos() {

            try {

                // Show loading message
                message.textContent = "Loading…";

                // Fetch data from the API
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/todos?_limit=12"
                );

                // Check if request was successful
                if (!response.ok) {
                    throw new Error("Unable to load tasks.");
                }

                // Convert response into JSON
                const todos = await response.json();

                // Remove loading message
                message.textContent = "";

                // Count completed tasks
                const completed = todos.filter(
                    todo => todo.completed
                ).length;

                // Update completed task count
                count.textContent =
                    `${completed} of ${todos.length} completed`;

                // Display every todo
                todos.forEach(todo => {

                    // Create a card
                    const card = document.createElement("article");
                    card.className = "card";

                    // Create task title
                    const title = document.createElement("h3");
                    title.textContent = todo.title;

                    // Create task status
                    const status = document.createElement("p");
                    status.className = "status";

                    if (todo.completed) {
                        status.textContent = "✅ Completed";
                    } else {
                        status.textContent = "⬜ Not completed";
                    }

                    // Add title and status to card
                    card.appendChild(title);
                    card.appendChild(status);

                    // Add card to webpage
                    todoList.appendChild(card);

                });

            } catch (error) {

                // Display friendly error message
                message.textContent =
                    "Sorry! We couldn't load the tasks. Please try again later.";

                count.textContent = "Tasks unavailable";

                console.error("Error:", error);

            }

        }

        // Start loading todos
        loadTodos();

    </script>

</body>
</html>
