
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        main {
            max-width: 1000px;
            margin: auto;
        }

        #count {
            font-size: 18px;
            font-weight: bold;
            color: #2563eb;
        }

        /* Mobile: one column */
        #todo-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .card {
            background-color: white;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .card h3 {
            margin-top: 0;
            font-size: 16px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
        }

        /* Screens 768px and wider: two columns */
        @media (min-width: 768px) {
            #todo-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        #message {
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Todo Dashboard</h1>
        <p id="count">Loading tasks...</p>
    </header>

    <main>

        <h2>My Tasks</h2>

        <p id="message">Loading…</p>

        <section id="todo-list" aria-label="Todo tasks">
        </section>

    </main>

    <footer>
        <p>Todo Dashboard - 2026</p>
    </footer>

    <script>

        // Get HTML elements
        const todoList = document.getElementById("todo-list");
        const count = document.getElementById("count");
        const message = document.getElementById("message");

        // Fetch todos using async/await
        async function loadTodos() {

            try {

                // Show loading message
                message.textContent = "Loading…";

                // Fetch 12 todos from the API
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/todos?_limit=12"
                );

                // Check for errors
                if (!response.ok) {
                    throw new Error("Failed to fetch todos");
                }

                // Convert response to JSON
                const todos = await response.json();

                // Remove loading message
                message.textContent = "";

                // Count completed todos
                const completed = todos.filter(
                    todo => todo.completed
                ).length;

                // Display completed count
                count.textContent =
                    `${completed} of ${todos.length} completed`;

                // Create a card for every todo
                todos.forEach(todo => {

                    const card = document.createElement("article");
                    card.className = "card";

                    const title = document.createElement("h3");
                    title.textContent = todo.title;

                    const status = document.createElement("p");

                    if (todo.completed) {
                        status.textContent = "✅";
                    } else {
                        status.textContent = "⬜";
                    }

                    card.appendChild(title);
                    card.appendChild(status);

                    todoList.appendChild(card);

                });

            } catch (error) {

                // Display friendly error message
                message.textContent =
                    "Sorry! We couldn't load your tasks. Please try again later.";

                count.textContent = "Tasks unavailable";

                console.error(error);

            }

        }

        // Load todos when the page opens
        loadTodos();

    </script>

</body>
</html>
